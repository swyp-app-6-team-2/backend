# 프로젝트명을 파일에 고정한다. 비어 있으면 compose 가 디렉터리명을 쓰고,
# 그러면 다른 볼륨(starpick_postgres-data)에 조용히 붙어 빈 DB 로 기동한다.
name: swyp-backend

services:
  postgres:
    image: postgres:18
    container_name: starpick-vm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    # 포트를 공개하지 않는다 — app 컨테이너만 내부 네트워크로 접근한다

  app:
    image: ${APP_IMAGE}
    container_name: starpick-vm-app
    restart: unless-stopped
    # 상한이 없으면 JVM 이 3.8Gi 기준 약 950MB 를 힙으로 잡는다. 컨테이너 인식 JVM 은 제한의 25%(512MB) 만
    # 힙으로 쓰므로 50% 로 올려 지금과 같은 1GB 를 유지한다. 70% 면 비힙까지 더해 2g 상한에 붙는다.
    # memswap_limit 을 같은 값으로 두어 swap 으로 새지 않게 한다.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      - postgres
    # env_file 로 넘긴다. environment: 에 ${VAR} 로 나열하면 .env.vm 에 '없는' 키가 빈 문자열로 주입돼
    # 앱의 fail-fast 가 무력화된다(ADMOB_AD_UNIT_ANDROID 실측). 값만 빈 줄(KEY=)은 이 방식으로도
    # 걸러지지 않으므로 필수 키 검사는 deploy/check-env.sh 가 한다.
    env_file:
      - .env.vm
    environment:
      # .env.vm 의 값을 조합해야 하는 것만 남긴다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    # 관리 포트는 호스트 loopback 에만 공개한다. 호스트의 Alloy 가 스크랩할 수 있게 열어두는 것이고
    # (스크랩 설정은 대시보드 작업에서 추가한다), 외부에서는 닿지 않는다.
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 기동 실측 41.99초. 그 전의 실패를 unhealthy 로 세지 않는다.
      start_period: 90s
    # SPRING_PROFILES_ACTIVE를 절대 지정하지 않는다 (§6 참고)

  caddy:
    image: caddy:2
    container_name: starpick-vm-caddy
    restart: unless-stopped
    environment:
      # Caddyfile 의 {$API_DOMAIN}. 비면 Caddy 기동이 실패해 80·443 이 통째로 죽는다.
      # .env.vm 전체를 주지 않는다 — 인터넷에 직접 노출된 TLS 종단이 쓰지도 않는 비밀값을 받을 이유가 없다.
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
