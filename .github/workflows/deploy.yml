name: Deploy

# VM 배포 로직 한 벌. 호출하는 쪽(cd-prod.yml 등)이 대상만 정한다.
#
# image_sha 를 필수 입력으로 받는다. workflow_run 컨텍스트의 github.sha 는
# 기본 브랜치 HEAD 이지 CI 가 통과한 커밋이 아니라서 내부에서 쓰지 않는다.
#
# vm_name 은 접속 직후 원격 hostname 과 대조한다. 저장소 레벨 변수(dev 용)가
# 남아 있어, Environment 등록을 빠뜨리면 조용히 dev 값으로 폴백할 수 있다.

on:
  workflow_call:
    inputs:
      environment:
        description: 배포 대상 GitHub Environment 이름
        required: true
        type: string
      image_sha:
        description: 배포할 이미지 태그(= CI 가 통과한 커밋 SHA)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast3
  ARTIFACT_REPOSITORY: starpick
  IMAGE_NAME: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    steps:
      # 이미지 SHA 가 정말 main 에 있는 커밋인지 확인한다. 임의 SHA 로 승인 게이트를
      # 통과한 배포를 막는다. 전체 이력이 필요해 fetch-depth: 0 이다.
      - name: 코드 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 이미지 SHA 가 main 의 조상인지 확인
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${{ inputs.image_sha }}" origin/main \
            || { echo "::error::${{ inputs.image_sha }} 는 origin/main 의 조상이 아닙니다"; exit 1; }

      - name: GCP 인증
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: gcloud 설정
        uses: google-github-actions/setup-gcloud@v3

      - name: 이미지가 Artifact Registry 에 있는지 확인
        run: |
          set -euo pipefail
          gcloud artifacts docker images describe \
            "${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${{ inputs.image_sha }}" \
            >/dev/null

      # 여기서부터 VM 을 만진다. 이후 단계는 실패해도 롤백 단계가 돌아야 하므로
      # 상태를 GITHUB_ENV 에 남긴다.
      - name: 대상 확인과 롤백 지점 기록
        id: target
        run: |
          set -euo pipefail
          OUT="$(./.github/scripts/remote.sh "cd ${{ vars.DEPLOY_PATH }} 2>/dev/null || exit 9
            echo \"HOSTNAME=\$(hostname)\"
            echo \"IMAGE=\$(sudo grep -m1 '^APP_IMAGE=' .env.vm | cut -d= -f2-)\"
            echo \"HEAD=\$(sudo git rev-parse HEAD)\"")"
          echo "$OUT"
          REMOTE_HOST="$(sed -n 's/^HOSTNAME=//p' <<<"$OUT")"
          if [ "$REMOTE_HOST" != "${{ vars.VM_NAME }}" ]; then
            echo "::error::접속한 호스트가 ${REMOTE_HOST} 입니다. ${{ vars.VM_NAME }} 를 기대했습니다"
            exit 1
          fi
          {
            echo "PREV_IMAGE=$(sed -n 's/^IMAGE=//p' <<<"$OUT")"
            echo "PREV_HEAD=$(sed -n 's/^HEAD=//p' <<<"$OUT")"
          } >> "$GITHUB_ENV"
        env:
          VM_NAME: ${{ vars.VM_NAME }}
          VM_ZONE: ${{ vars.VM_ZONE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      # 실패하면 여기서 멈춘다. 백업 없는 배포를 하지 않는다.
      - name: 배포 전 DB 백업
        run: ./.github/scripts/remote.sh "sudo ${{ vars.DEPLOY_PATH }}/deploy/backup.sh predeploy"
        env:
          VM_NAME: ${{ vars.VM_NAME }}
          VM_ZONE: ${{ vars.VM_ZONE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      - name: 배포
        id: rollout
        run: ./.github/scripts/deploy-remote.sh
        env:
          VM_NAME: ${{ vars.VM_NAME }}
          VM_ZONE: ${{ vars.VM_ZONE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_sha }}
          TARGET_SHA: ${{ inputs.image_sha }}

      # 취소도 failure 가 아니므로 always() 로 둔다. compose up 직후 취소되면
      # 검증되지 않은 이미지가 뜬 채로 끝나기 때문이다.
      - name: 실패 시 롤백
        if: always() && steps.rollout.outcome != 'success' && env.PREV_IMAGE != ''
        id: rollback
        run: ./.github/scripts/deploy-remote.sh
        env:
          VM_NAME: ${{ vars.VM_NAME }}
          VM_ZONE: ${{ vars.VM_ZONE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ env.PREV_IMAGE }}
          TARGET_SHA: ${{ env.PREV_HEAD }}

      - name: 성공 시 current 태그와 이미지 정리
        if: steps.rollout.outcome == 'success'
        run: |
          set -euo pipefail
          BASE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          gcloud artifacts docker tags add \
            "${BASE}:${{ inputs.image_sha }}" "${BASE}:${{ inputs.environment }}-current"

      - name: Discord 알림
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.rollout.outcome }}" = "success" ]; then
            MSG="✅ ${{ inputs.environment }} 배포 완료 · \`${SHORT}\` · <${RUN_URL}>"
          elif [ "${{ steps.rollback.outcome }}" = "success" ]; then
            MSG="⚠️ ${{ inputs.environment }} 배포 실패 — 이전 버전으로 되돌렸습니다 · \`${SHORT}\` · <${RUN_URL}>"
          else
            MSG="🚨 ${{ inputs.environment }} 배포 실패 **그리고 롤백도 실패**했습니다. 수동 개입이 필요합니다 · <${RUN_URL}>"
          fi
          jq -n --arg c "$MSG" \
            '{content: $c, allowed_mentions: {parse: []}, flags: 4}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- \
                "${{ secrets.DISCORD_OPS_WEBHOOK_URL }}" >/dev/null
        env:
          SHORT: ${{ inputs.image_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
