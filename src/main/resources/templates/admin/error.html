<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('오류', ~{::style})}">
<style>
    body.error-page { display: grid; place-items: center; padding: 20px; text-align: center; }

    .error-panel { display: grid; gap: 12px; justify-items: center; max-width: 380px; }

    .error-code { margin: 0; font-size: 56px; line-height: 64px; font-weight: 700; color: var(--primary); }

    .error-panel p { margin: 0 0 16px; }
</style>
</head>
<body class="error-page sky">
<main class="error-panel">
    <h1 class="error-code" th:text="${status}">500</h1>
    <p th:text="${message}">오류가 발생했습니다.</p>
    <a class="btn btn-primary" th:href="@{/admin/inquiries}">문의 목록으로</a>
</main>
</body>
</html>
