<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>별따먹자 관리자 로그인</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 16px; }
        label { display: block; margin: 12px 0 4px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 16px; width: 100%; padding: 10px; }
        .notice { color: #b3261e; }
    </style>
</head>
<body>
<h1>관리자 로그인</h1>
<p class="notice" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
<p class="notice" th:if="${param.expired}">세션이 만료됐어요. 다시 로그인해 주세요.</p>
<form th:action="@{/admin/login}" method="post">
    <label for="username">아이디</label>
    <input id="username" type="text" name="username" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
</form>
</body>
</html>
