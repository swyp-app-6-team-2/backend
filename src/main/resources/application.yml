spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/starpick
    username: starpick
    password: starpick
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          json_format_mapper: jackson3
    open-in-view: false
  task:
    execution:
      # Ingestion 이 등록하는 ThreadPoolTaskExecutor 가 Executor 타입이라, Boot 의
      # applicationTaskExecutor 자동설정 조건(@ConditionalOnMissingBean(Executor))이 꺾인다.
      # force 를 주면 Boot 가 자기 실행기를 그대로 만든다. 없으면 MVC async·@Async 가
      # Ingestion 전용 2스레드 0큐 풀을 함께 쓰고 spring.task.execution.* 설정이 무시된다.
      mode: force
    scheduling:
      pool:
        # 기본값 1이면 1시간 정리가 2초 선점을 막는다.
        size: 2

jwt:
  secret: starpick-jwt-secret-key-must-be-at-least-32-characters-long
  access-token-expiration: 1800000       # 30분
  refresh-token-expiration: 1209600000   # 14일
  signup-token-expiration: 300000        # 5분

google:
  client-id: ${GOOGLE_CLIENT_ID}

gcs:
  # 기본값을 두지 않는다. 설정 누락을 fail-fast 로 잡기 위한 의도이며 google.client-id 와 같다.
  bucket: ${GCS_BUCKET}
  # 업로드 URL 15분은 API 공통 계약으로 확정된 값이다.
  upload-url-expiration-minutes: 15
  # 조회 URL 이 더 긴 이유: 상세 화면을 열어둔 채 한참 뒤에 스크롤해도 이미지가 깨지지 않아야 한다.
  view-url-expiration-minutes: 60

ingestion:
  daily-limit: 20
  worker:
    enabled: false
    concurrency: 2
    poll-interval: 2s
  job:
    deadline: 120s
    stale-threshold: 3m
    queue-wait-limit: 10m
    result-ttl: 24h
    retention: 7d
  retry:
    max-attempts: 3
    backoffs: 2s,8s
  image:
    max-total-bytes: 14680064
  external:
    enabled: true
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    base-url: https://generativelanguage.googleapis.com
    analyze-timeout: 60s

logging:
  level:
    org.hibernate.SQL: debug
