spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/starpick
    username: starpick
    password: starpick
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          json_format_mapper: jackson3
    open-in-view: false
  task:
    scheduling:
      pool:
        # Ingestion 선점(2초)·Ingestion 정리·알림 발송이 한 스레드씩. 알림 발송은 FCM 응답을 기다리며 스레드를 잡는다.
        size: 3

starpick:
  ingredient:
    icon-base-url: ${INGREDIENT_ICON_BASE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000       # 30분
  refresh-token-expiration: 1209600000   # 14일
  signup-token-expiration: 300000        # 5분

google:
  client-id: ${GOOGLE_CLIENT_ID}

kakao:
  app-id: ${KAKAO_APP_ID}

apple:
  client-id: ${APPLE_CLIENT_ID}

gcs:
  # 기본값을 두지 않는다. 설정 누락을 fail-fast 로 잡기 위한 의도이며 google.client-id 와 같다.
  bucket: ${GCS_BUCKET}
  # 업로드 URL 15분은 API 공통 계약으로 확정된 값이다.
  upload-url-expiration-minutes: 15
  # 조회 URL 이 더 긴 이유: 상세 화면을 열어둔 채 한참 뒤에 스크롤해도 이미지가 깨지지 않아야 한다.
  view-url-expiration-minutes: 60

ingestion:
  daily-limit: 20
  worker:
    concurrency: 2
    poll-interval: 2s
  job:
    deadline: 120s
    stale-threshold: 3m
    queue-wait-limit: 10m
    result-ttl: 24h
    retention: 7d
  retry:
    max-attempts: 3
    backoffs: 2s,8s
  image:
    max-total-bytes: 14680064
  external:
    enabled: true
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    base-url: https://generativelanguage.googleapis.com
    analyze-timeout: 60s
    # 영상을 5초에 한 장면씩 본다. 1fps 대비 입력 토큰 58% 감소, 추출 품질 거의 동일(2026-09-13 실측).
    video-fps: 0.2
  instagram:
    # 단계별 상한(2026-09-14 실측: embed 최대 1.7초, 이미지 0.3초, MP4 17MB 0.5초, 업로드 약 3.5MB/s)
    fetch-timeout: 10s
    media-timeout: 30s
    # 50MB 는 업로드 약 15초라 upload-timeout 안에 든다. 더 큰 영상은 PROCESSING_FAILED.
    max-video-bytes: 52428800
    upload-timeout: 30s

logging:
  level:
    org.hibernate.SQL: debug
