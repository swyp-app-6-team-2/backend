server:
  servlet:
    session:
      # 관리자 페이지 전용 세션이다. 기본 30분이면 알림 링크를 누를 때마다 다시 로그인하게 된다.
      timeout: 8h
  # TLS 는 Caddy 가 끝낸다. X-Forwarded-Proto 를 받아들여야 https 로 인식해 세션 쿠키에 Secure 가 붙고
  # 리다이렉트가 https 로 나가며, getRemoteAddr() 가 실제 접속 IP 가 된다.
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/starpick
    username: starpick
    password: starpick
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
    open-in-view: false
  task:
    scheduling:
      pool:
        # Ingestion 선점(2초)·Ingestion 정리·알림 발송이 한 스레드씩. 알림 발송은 FCM 응답을 기다리며 스레드를 잡는다.
        size: 3

starpick:
  ingredient:
    icon-base-url: ${INGREDIENT_ICON_BASE_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000       # 30분
  refresh-token-expiration: 1209600000   # 14일
  signup-token-expiration: 300000        # 5분

google:
  client-id: ${GOOGLE_CLIENT_ID}

kakao:
  app-id: ${KAKAO_APP_ID}

apple:
  client-id: ${APPLE_CLIENT_ID}

gcs:
  # 기본값을 두지 않는다. 설정 누락을 fail-fast 로 잡기 위한 의도이며 google.client-id 와 같다.
  bucket: ${GCS_BUCKET}
  # 업로드 URL 15분은 API 공통 계약으로 확정된 값이다.
  upload-url-expiration-minutes: 15
  # 조회 URL 이 더 긴 이유: 상세 화면을 열어둔 채 한참 뒤에 스크롤해도 이미지가 깨지지 않아야 한다.
  view-url-expiration-minutes: 60

ingestion:
  daily-limit: 20
  worker:
    concurrency: 2
    poll-interval: 2s
  job:
    deadline: 120s
    stale-threshold: 3m
    queue-wait-limit: 10m
    result-ttl: 24h
    retention: 7d
  retry:
    max-attempts: 3
    backoffs: 2s,8s
  image:
    max-total-bytes: 14680064
  external:
    enabled: true
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    base-url: https://generativelanguage.googleapis.com
    analyze-timeout: 60s
    # 영상을 5초에 한 장면씩 본다. 1fps 대비 입력 토큰 58% 감소, 추출 품질 거의 동일(2026-09-13 실측).
    video-fps: 0.2
  instagram:
    # 단계별 상한(2026-09-14 실측: embed 최대 1.7초, 이미지 0.3초, MP4 17MB 0.5초, 업로드 약 3.5MB/s)
    fetch-timeout: 10s
    media-timeout: 30s
    # 50MB 는 업로드 약 15초라 upload-timeout 안에 든다. 더 큰 영상은 PROCESSING_FAILED.
    max-video-bytes: 52428800
    upload-timeout: 30s
  youtube:
    # 비어 있으면 Ingestion Worker 를 맡는 프로세스가 기동하지 않는다. 설명란 없이 분석 품질만
    # 조용히 떨어지는 것을 막는다 — GEMINI_API_KEY 를 스위치로 쓰는 것과 같은 이유다.
    api-key: ${YOUTUBE_API_KEY:}
    fetch-timeout: 10s

notification:
  external:
    enabled: true
  fcm:
    # 비어 있으면 이 프로세스는 알림 Worker 를 맡지 않는다. GEMINI_API_KEY 와 같은 방식이다.
    project-id: ${FCM_PROJECT_ID:}
  message:
    # 기획이 문구를 정하면 환경변수 대신 여기에 직접 적는다.
    meal-body: ${NOTIFICATION_MEAL_BODY:}
  push:
    # 앱 딥링크 실제 주소를 FE 가 확인하면 여기에 직접 적는다.
    deep-link: ${NOTIFICATION_DEEP_LINK:}

admin:
  # 기본값을 두지 않는다. 누락을 fail-fast 로 잡는다. 비밀번호는 BCrypt 제한으로 72바이트 이하.
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

inquiry:
  # 비어 있으면 접수 알림을 보내지 않는다. notification.fcm.project-id 와 같은 방식이다.
  discord-webhook-url: ${INQUIRY_DISCORD_WEBHOOK_URL:}
