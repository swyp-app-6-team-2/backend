# 테스트 전용 설정.
# 클래스패스에서 test resources가 main resources보다 앞서므로,
# 이 파일이 src/main/resources/application.yml 을 "대체"한다(병합이 아니다).
#
# spring.datasource.* 를 의도적으로 두지 않는다.
# 접속 정보는 TestcontainersConfiguration 의 @ServiceConnection 이 제공하며,
# 컨테이너를 import 하지 않은 테스트는 조용히 로컬 DB에 붙는 대신 시끄럽게 실패해야 한다.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        type:
          json_format_mapper: jackson3

jwt:
  secret: starpick-test-only-jwt-secret-key-not-for-any-real-environment
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000
  signup-token-expiration: 300000

google:
  client-id: test-google-client-id

# 실제 GCS 클라이언트 Bean 을 만들지 않는다. 만들면 자격증명을 찾다 컨텍스트가 깨진다.
# ObjectStorage 자리에는 TestcontainersConfiguration 이 FakeObjectStorage 를 등록한다.
# gcs.bucket 같은 값은 꺼진 GcsConfig 의 Bean 메서드 안에서만 쓰이므로 더미 값이 필요 없다.
gcs:
  enabled: false

ingestion:
  daily-limit: 20
  worker:
    concurrency: 2
    poll-interval: 2s
  job:
    deadline: 10s
    stale-threshold: 3m
    queue-wait-limit: 10m
    result-ttl: 24h
    retention: 7d
  retry:
    max-attempts: 3
    backoffs: 10ms,10ms
  image:
    max-total-bytes: 14680064
  external:
    enabled: false
  gemini:
    api-key: test-only-not-a-real-key
    model: test-model
    base-url: http://localhost:0
    analyze-timeout: 5s

logging:
  level:
    org.hibernate.SQL: warn
